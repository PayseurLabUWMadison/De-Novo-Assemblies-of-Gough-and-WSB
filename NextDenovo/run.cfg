[General]
job_type = local
job_prefix = nextDenovo
task = all # 'all', 'correct', 'assemble'
rewrite = yes # yes/no
deltmp = yes
rerun = 3
parallel_jobs = 8
input_type = raw
read_type = ont
input_fofn = ./input_gough.fofn
workdir = /mnt/researchdrive/payseur/peicheng/denovo_assembly/nextDenovo/GoughL2_Nov2025_2/01_Gough_rundir

[correct_option]
read_cutoff = 1k
genome_size = 2.7g
seed_cutoff = 10000
pa_correction = 6
sort_options = -m 40g -t 8
minimap2_options_raw = -t 7
correction_options = -p 8

[assemble_option]
minimap2_options_cns = -t 7
nextgraph_options = -a 1
